# Supabase Keep-Alive Workflow
# Hits the Supabase REST API on a schedule so the project is not paused for inactivity.
# No third-party actions — only curl + repo secrets (works under strict org action policies).

name: Supabase Keep Alive

on:
  schedule:
    # Run at midnight UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase RPC
        id: ping_rpc
        continue-on-error: true
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/health_check" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail --silent --show-error

      - name: Fallback ping (REST root)
        if: steps.ping_rpc.outcome == 'failure'
        run: |
          echo "RPC health_check failed, using REST root fallback..."
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            --fail --silent --show-error

      - name: Log success
        run: echo "Supabase pinged successfully at $(date -u)"
