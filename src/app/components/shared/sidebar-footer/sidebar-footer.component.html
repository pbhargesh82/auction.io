<div class="border-t border-gray-200 mt-auto p-3 bg-white w-full box-border">
  @if (!collapsed) {
  <!-- Expanded User Profile -->
  <div class="flex items-center space-x-3 p-3 rounded-lg bg-gray-50">
    <div class="flex items-center justify-center w-8 h-8 bg-indigo-600 rounded-full flex-shrink-0">
      <span class="text-sm font-medium text-white">
        {{ userDisplayName().charAt(0).toUpperCase() }}
      </span>
    </div>
    <div class="flex-1 min-w-0 flex flex-col justify-center">
      <p class="text-sm font-medium text-gray-900 truncate m-0 leading-tight">
        {{ userDisplayName() }}
      </p>
      <p class="text-xs text-gray-500 truncate m-0 mt-0.5 leading-tight">
        {{ user()?.email }}
      </p>
      <p class="text-[10px] font-bold uppercase tracking-wide m-0 mt-1"
        [class]="isAdmin() ? 'text-indigo-600' : 'text-gray-500'">
        {{ isAdmin() ? 'Super Admin' : 'User' }}
      </p>
    </div>
  </div>

  <!-- Sign Out Button -->
  <button (click)="onSignOut()"
    class="mt-3 w-full flex items-center justify-center px-3 py-2 text-sm font-medium text-red-700 bg-red-50 rounded-lg hover:bg-red-100 transition-colors duration-200 border-0 cursor-pointer">
    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
    </svg>
    Sign Out
  </button>

  <!-- Version Display -->
  <div class="mt-3 pt-3 border-t border-gray-200">
    <p class="text-xs text-center text-gray-400 m-0">{{ appVersion() }}</p>
  </div>

  } @else {
  <!-- Collapsed User Profile -->
  <div class="flex flex-col items-center space-y-2">
    <div class="flex items-center justify-center w-8 h-8 bg-indigo-600 rounded-full flex-shrink-0">
      <span class="text-sm font-medium text-white">
        {{ userDisplayName().charAt(0).toUpperCase() }}
      </span>
    </div>
    <button (click)="onSignOut()"
      class="flex items-center justify-center w-8 h-8 text-red-700 bg-red-50 rounded-lg hover:bg-red-100 transition-colors duration-200 border-0 cursor-pointer p-0"
      title="Sign Out">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </button>
  </div>

  <!-- Version Display (Collapsed) -->
  <div class="mt-3 pt-3 border-t border-gray-200 w-full">
    <p class="text-xs text-center text-gray-400 m-0" [title]="appVersion()">{{ appVersionShort() }}</p>
  </div>
  }
</div>
