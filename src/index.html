<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AuctionIo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    .app-bootstrap-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      background: #232931;
      color: #EEEEEE;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      gap: 1rem;
    }
    .app-bootstrap-loader__spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid rgba(238, 238, 238, 0.15);
      border-top-color: #4ECCA3;
      border-radius: 50%;
      animation: app-bootstrap-spin 0.8s linear infinite;
    }
    .app-bootstrap-loader__title {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    @keyframes app-bootstrap-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="mat-typography">
  <app-root>
    <div class="app-bootstrap-loader" aria-live="polite" aria-busy="true">
      <div class="app-bootstrap-loader__spinner" aria-hidden="true"></div>
      <div class="app-bootstrap-loader__title">Auction.io</div>
    </div>
  </app-root>
</body>
</html>
